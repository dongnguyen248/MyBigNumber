<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add2Num</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="application-shell">
    <section class="workspace" aria-labelledby="page-title">
        <header class="workspace-header">
            <p class="eyebrow">Decimal arithmetic</p>
            <h1 id="page-title">Add2Num</h1>
        </header>

        <form id="addition-form" class="addition-form" novalidate>
            <div class="row g-4">
                <div class="col-12 col-lg-6">
                    <label class="form-label" for="first-number">First number</label>
                    <textarea id="first-number" class="form-control number-input" name="firstNumber" required
                              inputmode="numeric" pattern="\d+" spellcheck="false" rows="6"></textarea>
                    <div class="invalid-feedback"></div>
                </div>
                <div class="col-12 col-lg-6">
                    <label class="form-label" for="second-number">Second number</label>
                    <textarea id="second-number" class="form-control number-input" name="secondNumber" required
                              inputmode="numeric" pattern="\d+" spellcheck="false" rows="6"></textarea>
                    <div class="invalid-feedback"></div>
                </div>
            </div>
            <div class="actions">
                <button id="submit-button" class="btn btn-primary" type="submit">Add numbers</button>
                <button id="reset-button" class="btn btn-outline-secondary" type="reset">Reset</button>
            </div>
        </form>

        <section id="progress-section" class="progress-section" hidden aria-live="polite">
            <div class="progress-meta">
                <span id="progress-label">Preparing calculation</span>
                <span id="progress-count">0 / 0</span>
            </div>
            <div class="progress" role="progressbar" aria-label="Addition progress" aria-valuemin="0" aria-valuemax="100"
                 aria-valuenow="0">
                <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
            </div>
        </section>

        <div id="error-message" class="alert alert-danger" role="alert" hidden></div>
        <section id="result-section" class="result-section" hidden aria-live="polite">
            <p class="eyebrow">Sum</p>
            <output id="result-value" class="result-value"></output>
        </section>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
